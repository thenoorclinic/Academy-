# Postgres local para desarrollo. En producción: Postgres gestionado en la UE (Neon/Supabase, Frankfurt).
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: noor
      POSTGRES_PASSWORD: noor
      POSTGRES_DB: noor_hub
    ports: ["5432:5432"]
    volumes: [noor_pg:/var/lib/postgresql/data]
volumes:
  noor_pg:
